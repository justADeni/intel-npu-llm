[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-llm"
version = "0.2.0"
description = "Run, quantize and serve LLMs on the Intel NPU (OpenVINO GenAI) from a modern CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "justADeni" }]
keywords = ["intel", "npu", "openvino", "llm", "openai", "quantization"]

dependencies = [
    "openvino==2025.2.0",
    "openvino-tokenizers==2025.2.0.1",
    "openvino-genai==2025.2.0",
    "optimum-intel[openvino]==1.24.0",
    "nncf==2.17.0",
    "onnx==1.18.0",
    "optimum==1.26.1",
    "huggingface_hub==0.33.5",
    "hf-xet==1.1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.urls]
Homepage = "https://github.com/justADeni/intel-npu-llm"

[project.scripts]
npu-llm = "npu_llm.cli:main"

[tool.setuptools.packages.find]
include = ["npu_llm*"]
